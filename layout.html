<!doctype html>
<html lang="sv">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Övning – mall</title>

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- KaTeX CSS -->
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">

	<!-- Lokal CSS -->
	<link rel="stylesheet" href="styles.css">

	<!-- Beskrivning för framtida sidor:
			 - Byt texten i <section id="task-content"> för frågetext (använd LaTeX med \\\(...\\\) eller $$ ... $$).
			 - Sätt korrekt svar i script.js: `const CORRECT_ANSWER = ...` eller använd per-sida init.
			 - Script laddas längst ned; varje sida är fristående. -->
</head>
<body class="bg-light d-flex flex-column min-vh-100">

	<header class="py-2 px-3 border-bottom bg-white">
		<div class="container d-flex justify-content-between align-items-center">
			<h1 class="h5 m-0">Matteövning</h1>
			<div class="small text-muted">Minimal mall</div>
		</div>
	</header>

	<main class="flex-grow-1">
		<div class="container-fluid h-100 p-0">
			<div class="row g-0 h-100">

				<!-- Övre panel: Uppgiftsfönster -->
				<section id="task" class="col-12 d-flex align-items-center justify-content-center border-bottom">
					<div class="container py-4 py-md-5">
						<div id="task-box" class="card shadow-sm rounded-3 p-4">
							<div id="task-content" class="task-content fs-4 lh-base">
								<!-- Exempel fråga (LaTeX stöd): -->
								<div>Beräkna \\( \\frac{1}{2} + \\frac{1}{3} \\).</div>
							</div>
							<div class="mt-3 text-end text-muted small">Tryck Enter eller använd knappen nedan.</div>
						</div>
					</div>
				</section>

				<!-- Nedre panel: Svar + kontroller -->
				<section id="answer" class="col-12 d-flex align-items-center justify-content-center">
					<div class="container py-4 py-md-5">
						<div class="card shadow-sm rounded-3 p-4">
							<form id="answer-form" class="row g-2 align-items-center">
								<div class="col-12 col-md-8">
									<label for="user-answer" class="form-label visually-hidden">Ditt svar</label>
									<input id="user-answer" class="form-control form-control-lg" inputmode="text" autocomplete="off" aria-label="Skriv ditt svar här" placeholder="Skriv ditt svar här" />
								</div>

								<div class="col-12 col-md-4 d-flex gap-2">
									<button id="check-btn" type="button" class="btn btn-primary flex-grow-1">Kontrollera</button>
									<button id="next-btn" type="button" class="btn btn-outline-secondary d-none">Nästa</button>
								</div>

								<!-- Miniräknare för touch / alternativ input -->
								<div class="col-12 mt-3">
									<div id="mini-calc" class="d-flex justify-content-center">
										<div class="calc-grid shadow-sm rounded-3 p-2 bg-white">
											<div class="calc-row">
												<button class="calc-btn" data-val="7">7</button>
												<button class="calc-btn" data-val="8">8</button>
												<button class="calc-btn" data-val="9">9</button>
												<button class="calc-action" data-action="back">⌫</button>
											</div>
											<div class="calc-row">
												<button class="calc-btn" data-val="4">4</button>
												<button class="calc-btn" data-val="5">5</button>
												<button class="calc-btn" data-val="6">6</button>
												<button class="calc-action" data-action="slash">/</button>
											</div>
											<div class="calc-row">
												<button class="calc-btn" data-val="1">1</button>
												<button class="calc-btn" data-val="2">2</button>
												<button class="calc-btn" data-val="3">3</button>
												<button class="calc-btn" data-val="0">0</button>
											</div>
											<div class="calc-row">
												<button class="calc-btn" data-val="," aria-label="komma"> , </button>
												<button class="calc-action" data-action="clear">C</button>
												<button class="calc-action" data-action="dot">.</button>
												<button class="calc-action" data-action="enter">✔</button>
											</div>
										</div>
									</div>
								</div>

								<div class="col-12 mt-3">
									<div id="feedback" role="status" aria-live="polite"></div>
								</div>

								<div class="col-12 mt-2 d-flex justify-content-between small text-muted">
									<div>Poäng: <span id="score">0</span></div>
									<div><button id="reset-score" type="button" class="btn btn-link p-0">Återställ poäng</button></div>
								</div>
							</form>
						</div>
					</div>
				</section>

			</div>
		</div>
	</main>

	<footer class="py-2 px-3 border-top bg-white">
		<div class="container small text-muted">Mall för matematikövningar — anpassa frågetext och svarslogik i `script.js`.</div>
	</footer>

	<!-- KaTeX JS -->
	<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body)"></script>

	<!-- Bootstrap JS bundle -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Lokal JS -->
	<script src="script.js"></script>
</body>
</html>
